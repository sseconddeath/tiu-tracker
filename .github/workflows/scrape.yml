name: Update TIU Lists

on:
  schedule:
    - cron: '2 6 * * *'
    - cron: '2 10 * * *'
    - cron: '2 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Push data
        run: |
          git config user.name "TIU Bot"
          git config user.email "bot@tiu-tracker.local"
          git add public/data/latest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update $(date +'%Y-%m-%d %H:%M')"
          git push
